# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: sparql-server

before:
  hooks:
    - go mod tidy
    - go test -short ./...

builds:
  - id: sparql-server
    main: ./cmd/sparql-server
    binary: sparql-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/tggo/sparql-server/internal/version.Version={{.Version}}
      - -X github.com/tggo/sparql-server/internal/version.Commit={{.FullCommit}}
      - -X github.com/tggo/sparql-server/internal/version.Date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - examples/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: tggo
    name: sparql-server
